[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs"
version = "1.0.0"
description = "RCS - Robot Control System for loading/unloading robots and logistics facilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.0",
    "uvicorn[standard]==0.24.0",
    "numpy==1.26.0",
    "scipy==1.11.0",
    "pydantic==2.4.0",
    "pydantic-settings==2.1.0",
    "websockets==12.0",
    "paho-mqtt==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
    "httpx==0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rcs*"]
