# RCS Backend + PostgreSQL
# Run:  docker compose -f docker-compose.yml up -d
# The backend auto-creates tables on startup (init_db) when RCS_STORAGE=postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rcs
      POSTGRES_PASSWORD: rcs
      POSTGRES_DB: rcs
    ports:
      - "5432:5432"
    volumes:
      - rcs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcs -d rcs"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: rcs/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      RCS_STORAGE: postgres
      RCS_DATABASE_URL: postgresql+asyncpg://rcs:rcs@db:5432/rcs
    ports:
      - "8100:8100"
    volumes:
      - ../..:/repo

volumes:
  rcs_pgdata:
