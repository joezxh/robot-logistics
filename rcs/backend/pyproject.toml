[build-system]
requires = ["flit_core >=3.2.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rcs"
version = "0.1.0"
description = "RCS unified backend (control + topology + orders + DXF)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.18",
    "robot-contracts>=1.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.1.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx2>=2.12.0"]

[tool.flit.module]
name = "rcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
