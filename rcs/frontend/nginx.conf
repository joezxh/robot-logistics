server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the RCS backend (adjust upstream as needed).
    location /api/rcs/ {
      proxy_pass http://rcs-backend:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Simulation backend (dashboard / scenes / warehouse-theatre).
    # nginx chooses the LONGEST matching prefix, so /api/rcs/ above still wins
    # for RCS traffic; everything else under /api falls through here.
    #
    # Note there is intentionally NO trailing slash on proxy_pass: it preserves
    # the original URI, and the simulation service mounts its routes under /api
    # (e.g. /api/tasks). A trailing slash would strip the prefix and 404.
    #
    # `proxy_buffering off` is REQUIRED — the simulation console streams over
    # SSE (/api/alerts/stream, /api/devices/{id}/joints) and buffering would
    # hold events back until the buffer flushes.
    location /api/ {
      proxy_pass http://sim-backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 600s;
    }

  # Long-lived connections for SSE/websockets if needed later.
  location /api/rcs/ws/ {
    proxy_pass http://rcs-backend:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
