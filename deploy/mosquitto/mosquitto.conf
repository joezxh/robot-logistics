# Mosquitto configuration for local development.
#
# Anonymous access is enabled deliberately: this file is for the local
# docker-compose stack only. Any real deployment must set allow_anonymous false
# and configure a password_file or TLS client certificates.

listener 1883
allow_anonymous true

# WebSocket listener so a browser can subscribe to the bus while debugging.
listener 9001
protocol websockets

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Keep the broker from being the bottleneck for the state stream: RCS publishes
# device state at up to 10 Hz per device with QoS 0.
max_queued_messages 1000
